<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invariant Factors — Smith Normal Form of xI − A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<style>
:root{
  --cream:#faf7f2; --paper:#fff; --navy:#18284a; --navy2:#2c4070;
  --accent:#3a6eb5; --red:#b33a2f; --red-bg:#fef0ee;
  --gold:#c8a430; --gray:#7a7a8a; --border:#ddd9d0;
  --L:#dde8fb; --L2:#3a60b0;
  --R:#d5f0e2; --R2:#2a7a50;
  --M:#fff;   --M2:#333;
  --done:#f3f5f8; --done2:#999;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Crimson Pro',Georgia,serif;background:var(--cream);color:var(--navy);font-size:17px;line-height:1.55;}

header{background:var(--navy);color:#fff;padding:1.7rem 2.5rem;border-bottom:3px solid var(--gold);}
header h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:400;letter-spacing:.02em;}
header p{color:#a0b8d8;font-style:italic;margin-top:.25rem;font-size:1.05rem;}

main{max-width:1280px;margin:0 auto;padding:2rem 1.5rem;}

.card{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:1.7rem 2rem;margin-bottom:1.8rem;box-shadow:0 2px 14px rgba(24,40,74,.06);}
.card h2{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:600;color:var(--navy);margin-bottom:1.1rem;}

.size-row{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap;margin-bottom:.85rem;}
.size-row label{display:flex;align-items:center;gap:.4rem;font-size:.9rem;}
.size-row input[type=number]{width:54px;padding:.26rem .4rem;text-align:center;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:1rem;color:var(--navy);}
.size-row input:focus{outline:none;border-color:var(--accent);}

.ex-row{display:flex;gap:.55rem;flex-wrap:wrap;margin-bottom:1.1rem;}
button{font-family:inherit;cursor:pointer;border:none;border-radius:4px;padding:.3rem .85rem;font-size:.9rem;transition:background .14s;}
.btn-ghost{background:var(--L);color:var(--navy2);border:1px solid #b8ccee;}
.btn-ghost:hover{background:#c8daff;}
.btn-solve{background:var(--red);color:#fff;padding:.52rem 1.9rem;font-size:1rem;margin-top:1.2rem;letter-spacing:.03em;}
.btn-solve:hover{background:#952e24;}

.mx-wrap{overflow-x:auto;margin:.7rem 0;}
.mx-grid{display:inline-grid;gap:6px 7px;align-items:center;}
.mx-grid input{width:60px;padding:.27rem .35rem;text-align:center;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:1rem;}
.mx-grid input:focus{outline:none;border-color:var(--accent);}
.mx-grid .clbl{text-align:center;font-size:.78rem;color:var(--gray);}
.mx-grid .rlbl{text-align:right;padding-right:8px;font-size:.84rem;color:var(--gray);}

/* ── steps ─────────────────────── */
.steps-wrap{display:flex;flex-direction:column;gap:1.3rem;}

.scard{background:var(--paper);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 2px 10px rgba(24,40,74,.05);}
.shd{background:var(--navy);color:#fff;padding:.52rem 1.1rem;display:flex;align-items:center;gap:.65rem;}
.sbadge{background:var(--gold);color:var(--navy);width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.77rem;font-weight:700;flex-shrink:0;}
.sbadge.init-b{background:#4a6a96;color:#fff;font-size:.65rem;letter-spacing:.02em;}
.sbadge.final-b{background:#2a7a52;color:#fff;}
.sdesc{color:#b8cce8;font-style:italic;font-size:.9rem;}

.twrap{overflow-x:auto;padding:.55rem .6rem .7rem;}

.tab{border-collapse:collapse;font-size:.87rem;}
.tab th,.tab td{padding:.34rem .62rem;border:1px solid #e0dbd3;text-align:center;white-space:nowrap;vertical-align:middle;}
.tab thead th{font-size:.74rem;font-weight:400;text-transform:uppercase;letter-spacing:.055em;padding:.22rem .62rem;}
.tab th.lhd{background:var(--L);color:var(--L2);}
.tab th.mhd{background:#f0f0ef;color:#555;}
.tab th.rhd{background:var(--R);color:var(--R2);}
.tab td.Lc{background:var(--L);}
.tab td.Rc{background:var(--R);}
.tab td.Mc{background:var(--M);}
.tab td.Dk{background:var(--done);color:var(--done2);}
.tab td.piv{background:var(--red-bg);}
.pbox{display:inline-block;border:2px solid var(--red);border-radius:3px;padding:0 5px;color:var(--red);font-weight:600;}
.tab td.sepr{border-right:2.5px solid #999 !important;}

/* ── result ─── */
.rescrd{background:var(--navy);color:#fff;border-radius:8px;padding:1.5rem 2rem;margin-top:.5rem;}
.rescrd h3{font-family:'Playfair Display',serif;color:var(--gold);font-size:1.25rem;font-weight:600;margin-bottom:1rem;}
.resrow{display:flex;align-items:baseline;gap:1rem;margin-bottom:.7rem;flex-wrap:wrap;}
.reslbl{color:#8ab2d8;font-size:.88rem;min-width:190px;}
.resval{background:rgba(255,255,255,.09);border-radius:4px;padding:.28rem .9rem;}
.resvals{display:flex;flex-wrap:wrap;gap:.5rem;}
.divchk{color:#7fba9e;font-size:.78rem;margin-top:.3rem;}

.keybox{background:var(--L);border:1px solid #c0ccdd;border-radius:6px;padding:.8rem 1.1rem;font-size:.87rem;color:var(--navy2);line-height:1.58;margin-top:1.1rem;}
.keybox strong{color:var(--navy);}

@media(max-width:650px){header{padding:1.2rem 1rem;}header h1{font-size:1.5rem;}main{padding:1rem .75rem;}.card{padding:1.2rem 1rem;}}
</style>
</head>
<body>

<header>
  <h1>Invariant Factors &amp; Smith Normal Form</h1>
  <p>Elementary row &amp; column operations on xI − A over ℝ[x], with full accounting of transformations</p>
</header>
<main>
  <div class="card">
    <h2>Enter a Square Matrix A</h2>
    <div class="size-row">
      <label>Size n: <input type="number" id="nSz" min="2" max="5" value="3"></label>
      <button class="btn-ghost" onclick="rebuildMx()">Resize</button>
    </div>
    <div class="ex-row">
      <button class="btn-ghost" onclick="loadEx(0)">3×3 repeated eigenvalue</button>
      <button class="btn-ghost" onclick="loadEx(1)">3×3 companion matrix</button>
      <button class="btn-ghost" onclick="loadEx(2)">2×2 Jordan block</button>
      <button class="btn-ghost" onclick="loadEx(3)">4×4 two Jordan blocks</button>
    </div>
    <p style="font-size:.86rem;color:var(--gray);margin-bottom:.5rem;">Enter integer or decimal entries. The algorithm reduces xI − A over ℚ[x] and displays each row/column operation.</p>
    <div class="mx-wrap" id="mxWrap"></div>
    <button class="btn-solve" onclick="doSolve()">Compute Smith Normal Form →</button>
  </div>
  <div id="out"></div>
</main>

<script>
/* ═════════════════════════════════════════
   FRACTION ARITHMETIC
   ═════════════════════════════════════════ */
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){const t=b;b=a%b;a=t;}return a||1;}
class Frac{
  constructor(n,d=1){if(d===0){this.n=0;this.d=1;return;}if(d<0){n=-n;d=-d;}const g=gcd(Math.abs(n),d);this.n=Math.round(n/g);this.d=Math.round(d/g);}
  static from(v){if(v instanceof Frac)return v;const s=String(v).trim();if(s.includes('/')){const[a,b]=s.split('/');return new Frac(+a,+b);}if(s.includes('.')){const dec=(s.split('.')[1]||'').length,dn=10**dec;return new Frac(Math.round(parseFloat(s)*dn),dn);}return new Frac(+s||0);}
  clone(){return new Frac(this.n,this.d);}
  add(o){return new Frac(this.n*o.d+o.n*this.d,this.d*o.d);}
  sub(o){return new Frac(this.n*o.d-o.n*this.d,this.d*o.d);}
  mul(o){return new Frac(this.n*o.n,this.d*o.d);}
  div(o){return new Frac(this.n*o.d,this.d*o.n);}
  neg(){return new Frac(-this.n,this.d);}
  recip(){return new Frac(this.d,this.n);}
  isZero(){return this.n===0;}
  isOne(){return this.n>0&&this.n===this.d;}
  abs(){return new Frac(Math.abs(this.n),this.d);}
  toTeX(){if(this.d===1)return String(this.n);const sg=this.n<0?'-':'';return`${sg}\\tfrac{${Math.abs(this.n)}}{${this.d}}`;}
  toFloat(){return this.n/this.d;}
}

/* ═════════════════════════════════════════
   POLYNOMIAL CLASS  (univariate over Frac)
   c[i] = coefficient of x^i
   ═════════════════════════════════════════ */
class Poly{
  constructor(c){this.c=(c&&c.length)?c.map(x=>x instanceof Frac?x:new Frac(x)):[new Frac(0)];this._trim();}
  _trim(){while(this.c.length>1&&this.c[this.c.length-1].isZero())this.c.pop();}
  static zero(){return new Poly([new Frac(0)]);}
  static one() {return new Poly([new Frac(1)]);}
  clone(){return new Poly(this.c.map(f=>f.clone()));}
  deg(){return this.isZero()?-Infinity:this.c.length-1;}
  isZero(){return this.c.length===1&&this.c[0].isZero();}
  lc(){return this.c[this.c.length-1];}
  isMonic(){return!this.isZero()&&this.lc().isOne();}

  add(b){const n=Math.max(this.c.length,b.c.length),r=[];for(let i=0;i<n;i++){const ai=i<this.c.length?this.c[i]:new Frac(0),bi=i<b.c.length?b.c[i]:new Frac(0);r.push(ai.add(bi));}return new Poly(r);}
  sub(b){const n=Math.max(this.c.length,b.c.length),r=[];for(let i=0;i<n;i++){const ai=i<this.c.length?this.c[i]:new Frac(0),bi=i<b.c.length?b.c[i]:new Frac(0);r.push(ai.sub(bi));}return new Poly(r);}
  mul(b){if(this.isZero()||b.isZero())return Poly.zero();const r=Array(this.c.length+b.c.length-1).fill(0).map(()=>new Frac(0));for(let i=0;i<this.c.length;i++)for(let j=0;j<b.c.length;j++)r[i+j]=r[i+j].add(this.c[i].mul(b.c[j]));return new Poly(r);}
  scale(f){return new Poly(this.c.map(ci=>ci.mul(f)));}
  neg(){return this.scale(new Frac(-1));}

  divRem(b){
    if(b.isZero())throw new Error("Poly div by 0");
    if(this.isZero()||this.deg()<b.deg())return[Poly.zero(),this.clone()];
    let rem=this.clone();
    const qc=Array(this.deg()-b.deg()+1).fill(0).map(()=>new Frac(0));
    while(!rem.isZero()&&rem.deg()>=b.deg()){
      const d=rem.deg()-b.deg(),lc=rem.lc().div(b.lc());
      qc[d]=lc;
      for(let i=0;i<=b.deg();i++)rem.c[i+d]=rem.c[i+d].sub(lc.mul(b.c[i]));
      rem._trim();
    }
    return[new Poly(qc),rem];
  }
  static gcd(a,b){if(b.isZero())return a.isZero()?Poly.one():a.scale(a.lc().recip());const[,r]=a.divRem(b);return Poly.gcd(b,r);}
  makeMonic(){return this.isZero()?this.clone():this.scale(this.lc().recip());}
  isOne(){return this.deg()===0&&this.c[0].isOne();}

  toTeX(){
    if(this.isZero())return'0';
    const terms=[];
    for(let i=this.deg();i>=0;i--)if(!this.c[i].isZero())terms.push({d:i,c:this.c[i]});
    if(!terms.length)return'0';
    let s='';
    for(let t=0;t<terms.length;t++){
      const{d,c}=terms[t],neg=c.n<0,abs=neg?c.neg():c;
      if(t===0){if(neg)s+='-';}else{s+=neg?' - ':' + ';}
      if(d===0){s+=abs.toTeX();}
      else if(d===1){if(!abs.isOne())s+=abs.toTeX();s+='x';}
      else{if(!abs.isOne())s+=abs.toTeX();s+=`x^{${d}}`;}
    }
    return s;
  }
}

/* ═════════════════════════════════════════
   SMITH NORMAL FORM  with step recording
   ═════════════════════════════════════════ */
function computeSNF(inputA){
  const n=inputA.length;
  // Build xI - A
  let M=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>{
    if(i===j)return new Poly([inputA[i][j].neg(),new Frac(1)]);
    return new Poly([inputA[i][j].neg()]);
  }));
  let L=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?Poly.one():Poly.zero()));
  let R=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?Poly.one():Poly.zero()));

  const steps=[];
  function snap(op,k,pivRC){
    steps.push({op,k,piv:pivRC||null,
      L:L.map(r=>r.map(p=>p.clone())),
      M:M.map(r=>r.map(p=>p.clone())),
      R:R.map(r=>r.map(p=>p.clone()))});
  }

  function swapR(i,j){[M[i],M[j]]=[M[j],M[i]];[L[i],L[j]]=[L[j],L[i]];snap({t:'sR',i,j},currentK,[i,j]);}
  function swapC(i,j){for(let r=0;r<n;r++){[M[r][i],M[r][j]]=[M[r][j],M[r][i]];[R[r][i],R[r][j]]=[R[r][j],R[r][i]];}snap({t:'sC',i,j},currentK,[currentK,i<j?i:j]);}
  function rowOp(i,j,q){for(let c=0;c<n;c++){M[i][c]=M[i][c].add(q.mul(M[j][c]));L[i][c]=L[i][c].add(q.mul(L[j][c]));}snap({t:'rO',i,j,q},currentK,[i,currentK]);}
  function colOp(i,j,q){for(let r=0;r<n;r++){M[r][i]=M[r][i].add(q.mul(M[r][j]));R[r][i]=R[r][i].add(q.mul(R[r][j]));}snap({t:'cO',i,j,q},currentK,[currentK,i]);}
  function scaleR(i,f){for(let c=0;c<n;c++){M[i][c]=M[i][c].scale(f);L[i][c]=L[i][c].scale(f);}snap({t:'sc',i,f},currentK,[i,i]);}

  let currentK=0;
  snap({t:'init'},0,null);

  for(let k=0;k<n;k++){
    currentK=k;
    let iter=0;
    while(iter++<80){
      // Find min-degree nonzero entry in M[k:,k:], prefer |lc|=1 (unit) then smaller |lc|
      let bd=Infinity,bv=Infinity,br=-1,bc=-1;
      for(let i=k;i<n;i++)for(let j=k;j<n;j++){
        if(!M[i][j].isZero()){
          const d=M[i][j].deg(),v=M[i][j].lc().abs().toFloat();
          if(d<bd||(d===bd&&v<bv)){bd=d;bv=v;br=i;bc=j;}
        }
      }
      if(br===-1)break; // sub-matrix zero

      if(br!==k)swapR(k,br);
      if(bc!==k)swapC(k,bc);

      // Clear row k (column operations)
      for(let j=k+1;j<n;j++){
        if(!M[k][j].isZero()){
          const[q]=M[k][j].divRem(M[k][k]);
          if(!q.isZero())colOp(j,k,q.neg());
        }
      }
      // Clear col k (row operations)
      for(let i=k+1;i<n;i++){
        if(!M[i][k].isZero()){
          const[q]=M[i][k].divRem(M[k][k]);
          if(!q.isZero())rowOp(i,k,q.neg());
        }
      }

      // Check row/col clear
      const rclr=Array.from({length:n-k-1},(_,j)=>M[k][j+k+1].isZero()).every(Boolean);
      const cclr=Array.from({length:n-k-1},(_,i)=>M[i+k+1][k].isZero()).every(Boolean);
      if(rclr&&cclr){
        // Check divisibility of remaining submatrix
        let badI=-1,badJ=-1;
        outer:for(let i=k+1;i<n;i++)for(let j=k+1;j<n;j++){
          if(!M[i][j].isZero()){const[,rem]=M[i][j].divRem(M[k][k]);if(!rem.isZero()){badI=i;badJ=j;break outer;}}
        }
        if(badI===-1)break; // done for this pivot
        // GCD trick: R_k += R_badI to expose GCD
        rowOp(k,badI,Poly.one());
      }
    }

    if(!M[k][k].isZero()&&!M[k][k].isMonic()){
      scaleR(k,M[k][k].lc().recip());
    }
  }

  const factors=[];
  for(let i=0;i<n;i++)if(!M[i][i].isZero())factors.push(M[i][i]);
  steps[steps.length-1].isFinal=true;
  return{steps,n,factors};
}

/* ═════════════════════════════════════════
   TEX HELPERS
   ═════════════════════════════════════════ */
function rk(t){try{return katex.renderToString(t,{throwOnError:false});}catch(e){return t;}}

function opToTeX(op){
  if(!op)return'';
  const{t}=op;
  if(t==='init')return'[\\,L\\mid xI-A\\mid R\\,]\\text{ — initial augmented matrix}';
  if(t==='sR') return`R_{${op.i+1}}\\leftrightarrow R_{${op.j+1}}\\;\\text{(swap rows — bring min-degree entry to pivot position)}`;
  if(t==='sC') return`C_{${op.i+1}}\\leftrightarrow C_{${op.j+1}}\\;\\text{(swap cols — bring min-degree entry to pivot position)}`;
  if(t==='rO'||t==='cO'){
    const ax=t==='rO'?'R':'C';
    const q=op.q;
    const negLead=!q.isZero()&&q.lc().n<0;
    if(negLead){
      const qn=q.neg(),qt=qn.toTeX(),wrap=qn.deg()>0?`(${qt})`:qt;
      return`${ax}_{${op.i+1}}\\leftarrow ${ax}_{${op.i+1}} - ${wrap}\\,${ax}_{${op.j+1}}`;
    }
    if(q.isOne()){
      return`${ax}_{${op.i+1}}\\leftarrow ${ax}_{${op.i+1}} + ${ax}_{${op.j+1}}\\;\\text{(GCD trick — expose common factor)}`;
    }
    const qt=q.toTeX(),wrap=q.deg()>0?`(${qt})`:qt;
    return`${ax}_{${op.i+1}}\\leftarrow ${ax}_{${op.i+1}} + ${wrap}\\,${ax}_{${op.j+1}}`;
  }
  if(t==='sc'){
    if(op.f.n===-op.f.d)return`R_{${op.i+1}}\\leftarrow -R_{${op.i+1}}\\;\\text{(normalize to monic)}`;
    return`R_{${op.i+1}}\\leftarrow ${op.f.toTeX()}\\cdot R_{${op.i+1}}\\;\\text{(normalize to monic)}`;
  }
  return'';
}

/* ═════════════════════════════════════════
   RENDER A SINGLE STEP
   ═════════════════════════════════════════ */
function renderStep(step, stepNum){
  const{op,k,piv,L,M,R,isFinal}=step;
  const n=L.length;
  const card=document.createElement('div');card.className='scard';
  // Header
  const hd=document.createElement('div');hd.className='shd';
  const badge=document.createElement('span');
  if(op.t==='init'){badge.className='sbadge init-b';badge.textContent='init';}
  else if(isFinal){badge.className='sbadge final-b';badge.textContent='✓';}
  else{badge.className='sbadge';badge.textContent=stepNum;}
  const desc=document.createElement('span');desc.className='sdesc';
  desc.innerHTML=rk(opToTeX(op));
  hd.append(badge,desc);card.appendChild(hd);

  // Tableau
  const wrap=document.createElement('div');wrap.className='twrap';
  const tbl=document.createElement('table');tbl.className='tab';
  // Thead
  const thead=document.createElement('thead');
  const hr=document.createElement('tr');
  const thL=document.createElement('th');thL.colSpan=n;thL.className='lhd sepr';thL.innerHTML='L &thinsp;(row transforms)';
  const thM=document.createElement('th');thM.colSpan=n;thM.className='mhd sepr';thM.innerHTML='M(x) = xI − A &thinsp;(current)';
  const thR=document.createElement('th');thR.colSpan=n;thR.className='rhd';thR.innerHTML='R &thinsp;(col transforms)';
  hr.append(thL,thM,thR);thead.appendChild(hr);
  // Sub-header: col labels
  const sr=document.createElement('tr');
  for(let j=0;j<n;j++){const th=document.createElement('th');th.className='lhd'+(j===n-1?' sepr':'');th.innerHTML=rk(`E_{${j+1}}`);sr.appendChild(th);}
  for(let j=0;j<n;j++){const th=document.createElement('th');th.className='mhd'+(j===n-1?' sepr':'');th.textContent='';sr.appendChild(th);}
  for(let j=0;j<n;j++){const th=document.createElement('th');th.className='rhd';th.innerHTML=rk(`e_{${j+1}}`);sr.appendChild(th);}
  thead.appendChild(sr);
  tbl.appendChild(thead);

  // Tbody
  const tbody=document.createElement('tbody');
  for(let i=0;i<n;i++){
    const tr=document.createElement('tr');
    // L cells
    for(let j=0;j<n;j++){
      const td=document.createElement('td');td.className='Lc'+(j===n-1?' sepr':'');
      td.innerHTML=rk(L[i][j].toTeX());tr.appendChild(td);
    }
    // M cells
    for(let j=0;j<n;j++){
      const td=document.createElement('td');
      const isDone=i<k&&i===j; // finalized diagonal entry
      const isPiv=piv&&piv[0]===i&&piv[1]===j;
      const isActivePiv=i===k&&j===k&&!M[i][j].isZero();
      if(isDone){td.className='Dk'+(j===n-1?' sepr':'');}
      else if(isPiv||isActivePiv){td.className='piv'+(j===n-1?' sepr':'');}
      else{td.className='Mc'+(j===n-1?' sepr':'');}
      const tex=M[i][j].toTeX();
      if(isPiv||isActivePiv){td.innerHTML=`<span class="pbox">${rk(tex)}</span>`;}
      else{td.innerHTML=rk(tex);}
      tr.appendChild(td);
    }
    // R cells
    for(let j=0;j<n;j++){
      const td=document.createElement('td');td.className='Rc';
      td.innerHTML=rk(R[i][j].toTeX());tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);card.appendChild(wrap);
  return card;
}

/* ═════════════════════════════════════════
   RENDER FULL OUTPUT
   ═════════════════════════════════════════ */
function renderOutput({steps,n,factors}){
  const out=document.getElementById('out');out.innerHTML='';
  const wrap=document.createElement('div');wrap.className='steps-wrap';

  let stepNum=0;
  steps.forEach(step=>{
    if(step.op.t!=='init')stepNum++;
    wrap.appendChild(renderStep(step,stepNum));
  });

  // ── Result card ──
  const res=document.createElement('div');res.className='rescrd';
  res.innerHTML=`<h3>Smith Normal Form &amp; Invariant Factors</h3>`;

  // SNF diagonal
  const diagTeX=`\\operatorname{diag}\\!\\left(${factors.map(p=>p.toTeX()).join(',\\;')}\\right)`;
  const snfRow=document.createElement('div');snfRow.className='resrow';
  snfRow.innerHTML=`<span class="reslbl">Smith Normal Form:</span><span class="resval">${rk(diagTeX)}</span>`;
  res.appendChild(snfRow);

  // Invariant factors listed with divisibility chain
  const ifRow=document.createElement('div');ifRow.className='resrow';
  let ifHTML=`<span class="reslbl">Invariant factors:</span><span class="resvals">`;
  factors.forEach((f,i)=>{ifHTML+=`<span class="resval">${rk(`d_{${i+1}}=${f.toTeX()}`)}</span>`;});
  ifHTML+=`</span>`;
  ifRow.innerHTML=ifHTML;
  res.appendChild(ifRow);

  // Divisibility chain check
  const dvd=document.createElement('div');dvd.className='divchk';
  let dvdTex=factors.map(f=>f.toTeX()).join(' \\mid ');
  dvd.innerHTML=`Divisibility chain: &nbsp;${rk(dvdTex)}`;
  res.appendChild(dvd);

  // Characteristic polynomial
  let charPoly=Poly.one();
  factors.forEach(f=>{charPoly=charPoly.mul(f);});
  const cpRow=document.createElement('div');cpRow.className='resrow';cpRow.style.marginTop='.8rem';
  cpRow.innerHTML=`<span class="reslbl">Characteristic polynomial:</span><span class="resval">${rk(`\\chi_A(x) = ${charPoly.toTeX()}`)}</span>`;
  res.appendChild(cpRow);

  // Minimal polynomial = last (largest) invariant factor
  const minPoly=factors[factors.length-1];
  const mpRow=document.createElement('div');mpRow.className='resrow';
  mpRow.innerHTML=`<span class="reslbl">Minimal polynomial:</span><span class="resval">${rk(`m_A(x) = ${minPoly.toTeX()}`)}</span>`;
  res.appendChild(mpRow);

  // Rational canonical form note
  const rcRow=document.createElement('div');rcRow.className='resrow';rcRow.style.marginTop='.4rem';
  const nontriv=factors.filter(f=>f.deg()>0);
  if(nontriv.length>0){
    const blockStr=nontriv.map((f,i)=>`C(d_{${factors.indexOf(f)+1}})`).join(' \\oplus ');
    rcRow.innerHTML=`<span class="reslbl">Rational canonical form:</span><span class="resval">${rk(`A \\sim ${blockStr}`)}</span>`;
  }
  res.appendChild(rcRow);

  // Diagonalizable check
  const isScalarFactor=factors.every(f=>f.deg()<=1);
  const noRepeatRoots=minPoly.deg()===new Set(/* rough */[minPoly.deg()]).size;
  const note=document.createElement('p');note.style.cssText='color:#9dd0b8;font-style:italic;font-size:.88rem;margin-top:.9rem;';
  note.textContent=`(${factors.length} invariant factor${factors.length>1?'s':''} · degree(min poly) = ${minPoly.deg()} · degree(char poly) = ${charPoly.deg()})`;
  res.appendChild(note);

  wrap.appendChild(res);

  // ── Key explanation ──
  const key=document.createElement('div');key.className='keybox';
  key.innerHTML=`
    <strong>Reading the tableau:</strong> At each step we maintain 
    <span style="color:var(--navy)">L · (xI − A) · R = M</span>
    where <span style="color:var(--L2)">L (blue)</span> accumulates <em>row</em> transforms and
    <span style="color:var(--R2)">R (green)</span> accumulates <em>column</em> transforms.
    <span style="color:var(--red)">Red-boxed</span> entries are active pivots.<br><br>
    Each row of L records the current row as a ℚ[x]-linear combination of the original rows of xI − A — 
    i.e., L is the product of all elementary row matrices applied so far.
    <br><br>
    <strong>Invariant factors</strong> d₁ | d₂ | ⋯ | dₙ are the monic diagonal entries of M at the end.
    Their product is the characteristic polynomial; the largest is the minimal polynomial.
    The <strong>rational canonical form</strong> of A is a block diagonal matrix of companion matrices C(dᵢ) for each non-trivial dᵢ.
  `;
  wrap.appendChild(key);
  out.appendChild(wrap);
  out.scrollIntoView({behavior:'smooth'});
}

/* ═════════════════════════════════════════
   UI
   ═════════════════════════════════════════ */
let cN=3;
const EXAMPLES=[
  {n:3,d:[[7,-2,1],[-2,10,-2],[1,-2,7]]},
  {n:3,d:[[0,0,-6],[1,0,11],[0,1,-6]]},      // companion of (x-1)(x-2)(x-3)=x³-6x²+11x-6
  {n:2,d:[[2,1],[0,2]]},                       // Jordan block J(2,2)
  {n:4,d:[[2,1,0,0],[0,2,0,0],[0,0,3,1],[0,0,0,3]]} // J(2,2)⊕J(3,2)
];

function rebuildMx(){
  cN=Math.min(Math.max(parseInt(document.getElementById('nSz').value)||2,2),5);
  document.getElementById('nSz').value=cN;
  buildGrid();
}

function buildGrid(){
  const cont=document.getElementById('mxWrap');cont.innerHTML='';
  const g=document.createElement('div');g.className='mx-grid';
  g.style.gridTemplateColumns=`auto ${Array(cN).fill('62px').join(' ')}`;
  // col labels
  const empty=document.createElement('div');g.appendChild(empty);
  for(let j=0;j<cN;j++){const d=document.createElement('div');d.className='clbl';d.textContent=`col ${j+1}`;g.appendChild(d);}
  // rows
  for(let i=0;i<cN;i++){
    const rl=document.createElement('div');rl.className='rlbl';rl.textContent=`row ${i+1}`;g.appendChild(rl);
    for(let j=0;j<cN;j++){
      const inp=document.createElement('input');inp.type='text';inp.id=`m${i}_${j}`;inp.placeholder='0';inp.autocomplete='off';
      g.appendChild(inp);
    }
  }
  cont.appendChild(g);
}

function loadEx(idx){
  const ex=EXAMPLES[idx];cN=ex.n;
  document.getElementById('nSz').value=cN;
  buildGrid();
  ex.d.forEach((row,i)=>row.forEach((v,j)=>{const el=document.getElementById(`m${i}_${j}`);if(el)el.value=v;}));
}

function doSolve(){
  try{
    const A=Array.from({length:cN},(_,i)=>Array.from({length:cN},(_,j)=>{
      const v=(document.getElementById(`m${i}_${j}`)?.value||'0').trim();
      return Frac.from(v||'0');
    }));
    const result=computeSNF(A);
    renderOutput(result);
  }catch(e){
    document.getElementById('out').innerHTML=`<div style="color:var(--red);padding:1rem;font-style:italic">Error: ${e.message}</div>`;
    console.error(e);
  }
}

window.addEventListener('DOMContentLoaded',()=>{buildGrid();loadEx(0);});
</script>
