<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Column Operations as Shears</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(145deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
    color: #e2e8f0;
    font-family: 'JetBrains Mono', monospace;
    padding: 20px;
    overflow-x: hidden;
  }
  input[type="range"] { cursor: pointer; accent-color: #6366f1; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback } = React;

/* ─── Geometry helpers ─── */
function cross2d(u, v) { return u[0] * v[1] - u[1] * v[0]; }
function vadd(u, v) { return [u[0]+v[0], u[1]+v[1]]; }
function vsub(u, v) { return [u[0]-v[0], u[1]-v[1]]; }
function vscale(s, v) { return [s*v[0], s*v[1]]; }
function vlen(v) { return Math.sqrt(v[0]*v[0] + v[1]*v[1]); }
function vdot(u, v) { return u[0]*v[0] + u[1]*v[1]; }

/* Project v onto u, return the component perpendicular to u */
function perpComponent(v, u) {
  const uLen = vlen(u);
  if (uLen < 1e-9) return v;
  const proj = vscale(vdot(v, u) / (uLen * uLen), u);
  return vsub(v, proj);
}

/* ─── Main App ─── */
function App() {
  const [a, setA] = useState(3);
  const [b, setB] = useState(1.5);
  const [c, setC] = useState(1);
  const [d, setD] = useState(3);
  const [shearParam, setShearParam] = useState(0); // 0 = original, 1 = fully sheared

  // Original columns
  const col1 = [a, c];
  const col2 = [b, d];

  // Shear: col2 - t*(b/a)*col1  (when a != 0)
  // At t=0 → original col2, at t=1 → [0, d - bc/a]
  const canShear = Math.abs(a) > 0.01;
  const shearAmount = canShear ? shearParam * (b / a) : 0;
  const col2Sheared = vsub(col2, vscale(shearAmount, col1));

  const det = a * d - b * c;

  // The perpendicular height from col2 to col1 direction (stays constant under shear)
  const heightVec = perpComponent(col2, col1);
  const height = vlen(heightVec);
  const base = vlen(col1);

  // Parallelogram vertices (origin, col1, col1+col2_sheared, col2_sheared)
  const origVerts = [[0,0], col1, vadd(col1, col2), col2];
  const shearedVerts = [[0,0], col1, vadd(col1, col2Sheared), col2Sheared];

  // Coordinate system
  const S = 52; // pixels per unit
  const cx = 300, cy = 280; // origin in SVG coords
  const toSVG = ([x, y]) => [cx + x * S, cy - y * S];

  // Grid range
  const gridLines = [];
  for (let i = -6; i <= 6; i++) {
    gridLines.push({ x1: cx + i * S, y1: cy - 6 * S, x2: cx + i * S, y2: cy + 3 * S });
    gridLines.push({ x1: cx - 6 * S, y1: cy + i * S, x2: cx + 6 * S, y2: cy + i * S });
  }

  // Height line: from col2Sheared, draw perpendicular to col1
  const projLen = canShear ? vdot(col2Sheared, col1) / (base * base) : 0;
  const projPoint = vscale(projLen, col1);
  const heightStart = toSVG(col2Sheared);
  const heightEnd = toSVG(projPoint);

  // Format matrix entries nicely
  const fmtCol2x = col2Sheared[0];
  const fmtCol2y = col2Sheared[1];

  return (
    <div style={{ maxWidth: "900px", margin: "0 auto" }}>
      {/* Header */}
      <div style={{ textAlign: "center", marginBottom: "16px" }}>
        <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: "26px", fontWeight: 900,
          background: "linear-gradient(135deg, #f59e0b, #ef4444, #a78bfa)",
          WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", margin: 0 }}>
          Column Operations Are Shears
        </h1>
        <p style={{ color: "#64748b", fontSize: "12px", margin: "6px 0 0" }}>
          C₂ − t·(b/a)·C₁ → C₂ slides the tip of column 2 along column 1. The area never changes.
        </p>
      </div>

      <div style={{ display: "flex", gap: "16px", flexWrap: "wrap", justifyContent: "center" }}>
        {/* Controls */}
        <div style={{ background: "rgba(15,23,42,0.8)", border: "1px solid #1e293b", borderRadius: "12px", padding: "16px", width: "220px", flexShrink: 0 }}>
          <h3 style={{ margin: "0 0 10px", fontSize: "12px", color: "#94a3b8", textTransform: "uppercase", letterSpacing: "1.5px" }}>Matrix entries</h3>
          {[
            { label: "a", val: a, set: setA, min: -4, max: 4, step: 0.1, color: "#f59e0b" },
            { label: "b", val: b, set: setB, min: -4, max: 4, step: 0.1, color: "#60a5fa" },
            { label: "c", val: c, set: setC, min: -4, max: 4, step: 0.1, color: "#f59e0b" },
            { label: "d", val: d, set: setD, min: -4, max: 4, step: 0.1, color: "#60a5fa" },
          ].map(({ label, val, set, min, max, step, color }) => (
            <div key={label} style={{ marginBottom: "8px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: "11px", color: "#94a3b8", marginBottom: "2px" }}>
                <span style={{ color }}>{label}</span>
                <span style={{ color, fontWeight: 600 }}>{val.toFixed(1)}</span>
              </div>
              <input type="range" min={min} max={max} step={step} value={val} onChange={e => set(Number(e.target.value))} style={{ width: "100%" }} />
            </div>
          ))}

          {/* Shear slider - the main event */}
          <div style={{ margin: "18px 0 0", padding: "12px", background: "rgba(239,68,68,0.08)", border: "1px solid rgba(239,68,68,0.25)", borderRadius: "10px" }}>
            <div style={{ fontSize: "11px", color: "#f87171", fontWeight: 600, marginBottom: "6px", textTransform: "uppercase", letterSpacing: "1px" }}>
              Shear parameter t
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: "12px", color: "#fca5a5", marginBottom: "4px" }}>
              <span>Original</span>
              <span style={{ fontWeight: 700 }}>{shearParam.toFixed(2)}</span>
              <span>Sheared</span>
            </div>
            <input type="range" min={0} max={1} step={0.005} value={shearParam}
              onChange={e => setShearParam(Number(e.target.value))}
              style={{ width: "100%", accentColor: "#ef4444" }} />
            <div style={{ fontSize: "10px", color: "#94a3b8", marginTop: "6px" }}>
              C₂ − t·(b/a)·C₁ → C₂
            </div>
          </div>

          {/* Info panel */}
          <div style={{ marginTop: "16px", padding: "12px", background: "rgba(30,41,59,0.5)", borderRadius: "8px", border: "1px solid #1e293b" }}>
            <div style={{ fontSize: "10px", color: "#64748b", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "8px" }}>Measurements</div>
            <div style={{ fontSize: "11px", color: "#f59e0b", marginBottom: "4px" }}>
              det = ad − bc = {det.toFixed(3)}
            </div>
            <div style={{ fontSize: "11px", color: "#34d399", marginBottom: "4px" }}>
              |base| = {base.toFixed(3)}
            </div>
            <div style={{ fontSize: "11px", color: "#a78bfa", marginBottom: "4px" }}>
              ⊥ height = {height.toFixed(3)}
            </div>
            <div style={{ fontSize: "11px", color: "#94a3b8", marginBottom: "8px" }}>
              base × height = {(base * height).toFixed(3)}
            </div>
            <div style={{ height: "1px", background: "#1e293b", margin: "8px 0" }} />
            <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "4px" }}>Current matrix:</div>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "12px", color: "#e2e8f0", lineHeight: "1.6" }}>
              [{a.toFixed(1)}&nbsp;&nbsp;{fmtCol2x.toFixed(2)}]
            </div>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "12px", color: "#e2e8f0", lineHeight: "1.6" }}>
              [{c.toFixed(1)}&nbsp;&nbsp;{fmtCol2y.toFixed(2)}]
            </div>
            {shearParam > 0.99 && canShear && (
              <div style={{ fontSize: "10px", color: "#4ade80", marginTop: "6px" }}>
                ✓ Upper-left entry reads off as triangular: det = {a.toFixed(1)} × {fmtCol2y.toFixed(2)} = {(a * fmtCol2y).toFixed(3)}
              </div>
            )}
          </div>

          {/* Presets */}
          <div style={{ marginTop: "12px" }}>
            <h3 style={{ margin: "0 0 6px", fontSize: "12px", color: "#94a3b8", textTransform: "uppercase", letterSpacing: "1.5px" }}>Presets</h3>
            {[
              { name: "Textbook [3 1.5; 1 3]", a: 3, b: 1.5, c: 1, d: 3 },
              { name: "Identity", a: 1, b: 0, c: 0, d: 1 },
              { name: "Rotation-ish", a: 2, b: -1, c: 1, d: 2 },
              { name: "Singular (det=0)", a: 2, b: 1, c: 4, d: 2 },
              { name: "Negative det", a: 1, b: 3, c: 2, d: 1 },
            ].map(p => (
              <button key={p.name}
                onClick={() => { setA(p.a); setB(p.b); setC(p.c); setD(p.d); setShearParam(0); }}
                onMouseEnter={e => e.target.style.background = "rgba(99,102,241,0.3)"}
                onMouseLeave={e => e.target.style.background = "rgba(99,102,241,0.15)"}
                style={{ display: "block", width: "100%", padding: "5px 8px", marginBottom: "4px",
                  background: "rgba(99,102,241,0.15)", border: "1px solid rgba(99,102,241,0.3)",
                  borderRadius: "6px", color: "#a5b4fc", fontSize: "10px", cursor: "pointer", textAlign: "left" }}>
                {p.name}
              </button>
            ))}
          </div>
        </div>

        {/* Main SVG */}
        <div style={{ flex: "1 1 600px", maxWidth: "660px" }}>
          <div style={{ background: "rgba(15,23,42,0.6)", border: "1px solid #1e293b", borderRadius: "12px", padding: "8px" }}>
            <svg viewBox="0 0 600 440" width="100%" style={{ display: "block" }}>
              {/* Grid */}
              {gridLines.map((l, i) => (
                <line key={i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke="#1e293b" strokeWidth="0.5" />
              ))}
              {/* Axes */}
              <line x1={cx - 300} y1={cy} x2={cx + 300} y2={cy} stroke="#334155" strokeWidth="1.5" />
              <line x1={cx} y1={cy - 300} x2={cx} y2={cy + 150} stroke="#334155" strokeWidth="1.5" />
              {/* Axis labels */}
              {[-4,-3,-2,-1,1,2,3,4].map(i => (
                <g key={`xl${i}`}>
                  <line x1={cx+i*S} y1={cy-3} x2={cx+i*S} y2={cy+3} stroke="#475569" strokeWidth="1" />
                  <text x={cx+i*S} y={cy+16} textAnchor="middle" fill="#475569" fontSize="9" fontFamily="'JetBrains Mono', monospace">{i}</text>
                </g>
              ))}
              {[-4,-3,-2,-1,1,2,3,4,5].map(i => (
                <g key={`yl${i}`}>
                  <line x1={cx-3} y1={cy-i*S} x2={cx+3} y2={cy-i*S} stroke="#475569" strokeWidth="1" />
                  <text x={cx-12} y={cy-i*S+4} textAnchor="end" fill="#475569" fontSize="9" fontFamily="'JetBrains Mono', monospace">{i}</text>
                </g>
              ))}

              {/* Ghost: original parallelogram (when shearing) */}
              {shearParam > 0.01 && (
                <polygon
                  points={origVerts.map(toSVG).map(p => p.join(",")).join(" ")}
                  fill="rgba(99,102,241,0.06)" stroke="#6366f1" strokeWidth="1" strokeDasharray="6,4" opacity="0.5" />
              )}

              {/* Current parallelogram */}
              <polygon
                points={shearedVerts.map(toSVG).map(p => p.join(",")).join(" ")}
                fill={det >= 0 ? "rgba(52,211,153,0.12)" : "rgba(248,113,113,0.12)"}
                stroke={det >= 0 ? "#34d399" : "#f87171"} strokeWidth="2" />

              {/* Height line (perpendicular from col2_sheared to col1 direction) */}
              <line x1={heightStart[0]} y1={heightStart[1]} x2={heightEnd[0]} y2={heightEnd[1]}
                stroke="#a78bfa" strokeWidth="1.5" strokeDasharray="5,3" opacity="0.8" />
              {/* Right angle marker */}
              {height > 0.2 && (() => {
                const hDir = perpComponent(col2Sheared, col1);
                const hN = vscale(1/vlen(hDir), hDir);
                const bDir = vscale(1/base, col1);
                const corner = projPoint;
                const sz = 0.2;
                const p1 = toSVG(vadd(corner, vscale(sz, hN)));
                const p2 = toSVG(vadd(vadd(corner, vscale(sz, hN)), vscale(sz, bDir)));
                const p3 = toSVG(vadd(corner, vscale(sz, bDir)));
                return <polyline points={`${p1} ${p2} ${p3}`} fill="none" stroke="#a78bfa" strokeWidth="1" opacity="0.7" />;
              })()}
              {/* Height label */}
              <text x={(heightStart[0]+heightEnd[0])/2 + 10} y={(heightStart[1]+heightEnd[1])/2}
                fill="#a78bfa" fontSize="11" fontWeight="600" fontFamily="'JetBrains Mono', monospace">
                h = {height.toFixed(2)}
              </text>

              {/* Column 1 vector */}
              <defs>
                <marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                  <polygon points="0,0 10,4 0,8" fill="#f59e0b" />
                </marker>
                <marker id="ah2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                  <polygon points="0,0 10,4 0,8" fill="#60a5fa" />
                </marker>
                <marker id="ah2g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                  <polygon points="0,0 10,4 0,8" fill="#6366f1" opacity="0.4" />
                </marker>
              </defs>

              {/* Col 1 arrow */}
              <line x1={cx} y1={cy} x2={toSVG(col1)[0]} y2={toSVG(col1)[1]}
                stroke="#f59e0b" strokeWidth="3" markerEnd="url(#ah1)" />
              <text x={toSVG(col1)[0] + 8} y={toSVG(col1)[1] - 8}
                fill="#f59e0b" fontSize="13" fontWeight="700" fontFamily="'JetBrains Mono', monospace">
                C₁
              </text>
              <text x={toSVG(col1)[0] + 8} y={toSVG(col1)[1] + 8}
                fill="#f59e0b" fontSize="10" fontFamily="'JetBrains Mono', monospace" opacity="0.7">
                ({a.toFixed(1)}, {c.toFixed(1)})
              </text>

              {/* Ghost col2 arrow (original) */}
              {shearParam > 0.01 && (
                <g opacity="0.35">
                  <line x1={cx} y1={cy} x2={toSVG(col2)[0]} y2={toSVG(col2)[1]}
                    stroke="#6366f1" strokeWidth="2" strokeDasharray="6,4" markerEnd="url(#ah2g)" />
                  <text x={toSVG(col2)[0] + 8} y={toSVG(col2)[1] - 4}
                    fill="#6366f1" fontSize="10" fontFamily="'JetBrains Mono', monospace">
                    C₂ orig
                  </text>
                </g>
              )}

              {/* Col 2 sheared arrow */}
              <line x1={cx} y1={cy} x2={toSVG(col2Sheared)[0]} y2={toSVG(col2Sheared)[1]}
                stroke="#60a5fa" strokeWidth="3" markerEnd="url(#ah2)" />
              <text x={toSVG(col2Sheared)[0] + 8} y={toSVG(col2Sheared)[1] - 8}
                fill="#60a5fa" fontSize="13" fontWeight="700" fontFamily="'JetBrains Mono', monospace">
                C₂
              </text>
              <text x={toSVG(col2Sheared)[0] + 8} y={toSVG(col2Sheared)[1] + 8}
                fill="#60a5fa" fontSize="10" fontFamily="'JetBrains Mono', monospace" opacity="0.7">
                ({fmtCol2x.toFixed(2)}, {fmtCol2y.toFixed(2)})
              </text>

              {/* Shear path arc: show how col2 tip slides along col1 direction */}
              {shearParam > 0.01 && shearParam < 0.99 && (
                <line x1={toSVG(col2)[0]} y1={toSVG(col2)[1]}
                  x2={toSVG(col2Sheared)[0]} y2={toSVG(col2Sheared)[1]}
                  stroke="#ef4444" strokeWidth="1.5" strokeDasharray="4,3" opacity="0.6" />
              )}

              {/* Area label */}
              {(() => {
                const centroid = vscale(0.25, shearedVerts.reduce((a,b) => vadd(a,b), [0,0]));
                const [lx, ly] = toSVG(centroid);
                return (
                  <g>
                    <text x={lx} y={ly - 6} textAnchor="middle" fill={det >= 0 ? "#34d399" : "#f87171"}
                      fontSize="14" fontWeight="700" fontFamily="'JetBrains Mono', monospace">
                      Area = |det|
                    </text>
                    <text x={lx} y={ly + 12} textAnchor="middle" fill={det >= 0 ? "#34d399" : "#f87171"}
                      fontSize="12" fontFamily="'JetBrains Mono', monospace">
                      = {Math.abs(det).toFixed(3)}
                    </text>
                  </g>
                );
              })()}

              {/* Origin dot */}
              <circle cx={cx} cy={cy} r="4" fill="#e2e8f0" />
            </svg>
          </div>

          {/* Explanation cards */}
          <div style={{ display: "flex", gap: "10px", marginTop: "12px", flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 45%", background: "rgba(15,23,42,0.8)", border: "1px solid #1e293b",
              borderRadius: "10px", padding: "12px" }}>
              <div style={{ fontSize: "11px", color: "#f59e0b", fontWeight: 700, marginBottom: "4px" }}>Why area is preserved</div>
              <div style={{ fontSize: "11px", color: "#94a3b8", lineHeight: "1.5" }}>
                The shear slides C₂'s tip parallel to C₁. The perpendicular height <span style={{color:"#a78bfa"}}>h = {height.toFixed(3)}</span> from
                C₂ to the C₁ direction never changes. Same base, same height → same area.
              </div>
            </div>
            <div style={{ flex: "1 1 45%", background: "rgba(15,23,42,0.8)", border: "1px solid #1e293b",
              borderRadius: "10px", padding: "12px" }}>
              <div style={{ fontSize: "11px", color: "#60a5fa", fontWeight: 700, marginBottom: "4px" }}>What the operation achieves</div>
              <div style={{ fontSize: "11px", color: "#94a3b8", lineHeight: "1.5" }}>
                {shearParam > 0.99 && canShear ? (
                  <span>At t=1, the matrix is upper-triangular. The det is just the product of diagonal entries: <span style={{color:"#4ade80"}}>{a.toFixed(1)} × {fmtCol2y.toFixed(2)} = {(a*fmtCol2y).toFixed(3)}</span></span>
                ) : (
                  <span>Drag the shear slider to t=1. The top entry of C₂ goes to zero, making the matrix triangular — the determinant becomes readable as a product of diagonal entries.</span>
                )}
              </div>
            </div>
          </div>

          {/* Singular case warning */}
          {Math.abs(det) < 0.05 && (
            <div style={{ marginTop: "10px", padding: "10px", background: "rgba(239,68,68,0.1)",
              border: "1px solid rgba(239,68,68,0.3)", borderRadius: "8px", textAlign: "center" }}>
              <span style={{ fontSize: "12px", color: "#f87171" }}>
                det ≈ 0 — the parallelogram has collapsed to a line. The columns are (nearly) linearly dependent.
              </span>
            </div>
          )}
        </div>
      </div>

      <div style={{ textAlign: "center", marginTop: "16px", color: "#475569", fontSize: "10px", lineHeight: "1.6" }}>
        Column operations = shears = same base, same height = preserved area = preserved determinant
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
